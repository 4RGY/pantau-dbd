<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Alur data pantau-dbd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Palet diambil dari dashboard/src/styles/global.css supaya diagram sewarna situs. */
  :root {
    --bg: #08090b;
    --haze: rgba(255,255,255,0.024);
    --haze-2: rgba(255,255,255,0.045);
    --line: rgba(255,255,255,0.072);
    --line-2: rgba(255,255,255,0.13);
    --ink: #eceae6;
    --dim: #9c9a95;
    --faint: #6b6965;
    --amber: #d99b3f;
    --steel: #7f93a6;
    --green: #5f9c7e;

    --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    width: 1480px;
    padding: 34px 0 26px;
    -webkit-font-smoothing: antialiased;
  }
  .kepala { padding: 0 50px 20px; }
  .kepala .kicker {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 9px;
  }
  .kepala h1 { font-size: 25px; font-weight: 600; letter-spacing: -.015em; }
  .kepala p { color: var(--dim); font-size: 13px; margin-top: 8px; max-width: 900px; line-height: 1.55; }
</style>
</head>
